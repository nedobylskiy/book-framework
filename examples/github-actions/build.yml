name: Build book

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "book.config.json"
      - "package.json"
      - "package-lock.json"
      - "manuscript/**"
      - "assets/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout book repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate book
        run: npx book validate

      - name: Build all formats
        run: npx book build

      - name: Build per-chapter FB2 files
        run: npx book build-chapters

      - name: Upload book artifacts
        uses: actions/upload-artifact@v7
        with:
          name: book-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
