name: Release book

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout book repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate book
        run: npx book validate

      - name: Build all formats
        run: npx book build

      - name: Build per-chapter FB2 files
        run: npx book build-chapters

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

      - name: Attach all build files to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
